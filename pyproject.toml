[project]
name = "agentic-workbench"
version = "0.2.0"
description = "Enables engineers to set up their workstation and work in an agent-enabled environment: AI coding assistants configured consistently, on a toolchain that is known to work."
readme = "README.md"
# Python 3.12 is the minimum supported version. Earlier versions have not been tested.
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "git-cliff>=2.14.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff",
]

# No `target-version` here: ruff infers it from `requires-python` above, and
# holding one fact in two places is how the two diverge. No version floor on
# ruff either — `uv.lock` records what is actually resolved, so a number here
# would be a second copy of that fact, stale the day ruff releases.
[tool.ruff.lint]
# The baseline is whatever the installed ruff's default set contains, which is
# already wide. `extend-select` adds only what that default leaves out, so this
# list stays short and does not need maintaining against each release.
#
# E402, module-import-not-at-top-of-file: several scripts here extend sys.path
# before importing the module under test. Ruff exempts that specific pattern, so
# enabling E402 flags nothing today; it is on to catch the ordinary case — an
# import placed after real code — in anything added later.
extend-select = ["E402"]

[tool.pyright]
# The scripts are run as files, not installed as packages, and each test adds its
# script directory to sys.path before importing it. These paths tell pyright the
# same thing, so those imports resolve.
extraPaths = [
    "skills/setup-agents/scripts",
    "workstation/scripts",
    "workstation/agent/skills/fetch-to-markdown/scripts",
    "workstation/agent/skills/python-quality/scripts",
    "workstation/agent/skills/review/scripts",
    "workstation/agent/skills/session-signature/scripts",
    "workstation/agent/skills/verify-docs/scripts",
]
# Setting `exclude` replaces pyright's defaults, so they are restated first. The
# python-quality templates are copied into other projects and import packages
# that exist only there.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "workstation/agent/skills/python-quality/templates",
]
